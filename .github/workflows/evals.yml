name: Evals

# Evals run real Claude sessions and cost money: manual or weekly only.
on:
  workflow_dispatch:
    inputs:
      case:
        description: Case glob (empty = all)
        required: false
        default: ""
      runs:
        description: Runs per case
        required: false
        default: "1"
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Check ANTHROPIC_API_KEY
        id: key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY secret not set; skipping evals"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.key.outputs.present == 'true'
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
        if: steps.key.outputs.present == 'true'
      - name: Run eval suite
        if: steps.key.outputs.present == 'true'
        working-directory: plugins/flutter-forge
        run: |
          ARGS=(--trust-plugin --no-publish --runs "${{ github.event.inputs.runs || '1' }}" --max-cost-usd 15 --threshold 0.7 --json results.json)
          if [ -n "${{ github.event.inputs.case }}" ]; then ARGS+=(--case "${{ github.event.inputs.case }}"); fi
          claude plugin eval . "${ARGS[@]}"
      - uses: actions/upload-artifact@v4
        if: always() && steps.key.outputs.present == 'true'
        with:
          name: eval-results
          path: plugins/flutter-forge/results.json
